[package]
name = "alwansyahrian284-eng/bayar-kas-digital"
version = "0.1.1"
private = true
entrypoint = "run"

[dependencies]
"php/php" = "=8.3.403"

[fs]
"/app/app" = "app"
"/app/bootstrap" = "bootstrap"
"/app/config" = "config"
"/app/database/migrations" = "database/migrations"
"/app/database/seeders" = "database/seeders"
"/app/database/factories" = "database/factories"
"/app/public" = ".wasmer-runtime/public"
"/app/resources" = "resources"
"/app/routes" = "routes"
"/app/storage" = ".wasmer-runtime/storage"
"/app/vendor" = "vendor"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"
[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
